# atoms.conf — the LINA atom fleet (sourced by deploy-atoms.sh / collect-atoms.sh).
#
# Format:  atomId|host|ssh-user|key|remote-path|note
#   atomId      short label used in data/atoms/<atomId>/ and log lines
#   host        hostname or IP (use the IP — never depend on workstation
#               ssh-config drift; the key is passed explicitly anyway)
#   ssh-user    login user on the atom
#   key         explicit identity file — ALWAYS passed via -i: offering many
#               keys first hits the atom's MaxAuthTries and auth fails
#   remote-path absolute path of the LINA deployment on that atom
#   note        free text; "relay" rows are SKIPPED by both scripts
#
# Fleet facts (2026-09):
#   - All LINA atoms are clonezilla clones of atom01: node 16.20 and a working
#     node_modules (better-sqlite3 ABI 93) ship with the image. Only code and
#     dist/ are rsynced — NEVER the workstation's node_modules (workstation is
#     node 18 / ABI 108; copying it would brick every atom at boot).
#   - atom4 (.14) is the RELAY — it runs different code. It stays commented
#     out so nobody ever deploys LINA onto it by accident.

atom01|192.168.1.11|atom|ATOM01_KEY|/home/atom/Documents/PROJECTS/LINA|first clone, live
# atom02|192.168.1.12|atom|ATOM02_KEY|/home/atom/Documents/PROJECTS/LINA|clone — enable when provisioned
# atom03|192.168.1.13|atom|ATOM03_KEY|/home/atom/Documents/PROJECTS/LINA|clone — enable when provisioned
# atom4|192.168.1.14|atom|ATOM4_KEY|/home/atom/Documents/PROJECTS/LINA|RELAY — different code, never deploy LINA here
